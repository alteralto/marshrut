<!doctype html>
<html lang="ru" data-style="apple" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Материальная помощь · от заявления до приказа</title>

<link rel="stylesheet" href="route-guide.css">
<script src="../mockup/graphite.js"></script>
<script src="glossary-terms.js"></script>
<script src="route-guide.js"></script>

<script src="scene-kit.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.52 var(--font)}
main{width:min(1180px,calc(100% - 30px));margin:32px auto 52px}
a{color:var(--stamp);text-underline-offset:4px}
h1{font-size:clamp(32px,6vw,66px);line-height:1;letter-spacing:-.055em;margin:17px 0 10px;text-wrap:balance}
header p{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(245px,1fr);gap:14px;margin-top:24px;align-items:start}
.player,.timeline,.source{border:1px solid var(--rule);border-radius:var(--radius-card);background:var(--sheet);box-shadow:var(--card-shadow)}
.player{overflow:hidden}
.stage{display:block;width:100%;height:auto;aspect-ratio:960 / 460;background:var(--lane)}
.beat{padding:15px clamp(14px,3vw,27px);min-height:178px;border-top:1px solid var(--rule)}
.beat h2{font-size:clamp(19px,2.5vw,24px);margin:2px 0 5px;line-height:1.2;letter-spacing:-.025em}
.beat p{color:var(--muted);margin:0}
.beat .phase{font-size:12px;font-weight:700;color:var(--stamp);letter-spacing:.06em;text-transform:uppercase}
.beat .condition{font-size:13px;margin-top:8px;color:var(--ink)}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px clamp(14px,3vw,27px);border-top:1px solid var(--rule)}
button{font:inherit;font-size:13px;cursor:pointer;background:var(--lane);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:6px 9px}
button:hover:not(:disabled){border-color:var(--stamp)}
button:disabled{opacity:.42;cursor:default}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
#play{background:var(--action);color:var(--on-stamp);border-color:transparent;font-weight:700;min-width:98px}
#position{margin:0 0 0 auto;color:var(--muted);font-size:13px}
#progress{width:100%;accent-color:var(--stamp);margin:2px 0 0}
.timeline{padding:12px}
.timeline h2{font-size:17px;margin:0 0 9px}
.timeline ol{padding:0;margin:0;list-style:none;display:grid;gap:6px}
.timeline button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:7px;align-items:center;text-align:left;line-height:1.25}
.timeline button small{display:block;margin-top:3px;color:var(--muted)}
.timeline button span:first-child{color:var(--stamp);font-variant-numeric:tabular-nums}
.timeline button[aria-current="step"]{background:var(--stamp-soft);border-color:var(--selected-line);color:var(--selected)}
.source{margin-top:13px;padding:12px 16px}
summary{cursor:pointer;font-weight:650}
blockquote{margin:10px 0;padding-left:12px;border-left:2px solid var(--rule-strong);color:var(--muted);white-space:pre-line}
.source a{font-size:14px}
@media(max-width:730px){.layout{grid-template-columns:1fr}.timeline ol{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>
<body>
<main>
    <a href="mipt-scene-library.html">← Библиотека сцен</a>
  <header>
    <a href="aid-comic.html">«Путь выписки» по пункту 2.4</a>
    <h1>Материальная помощь<br>от заявления до приказа</h1>
    <p>Регламент МФТИ для обучающихся · пункты 1.2–3.5</p>
  </header>
  <div class="layout">
    <section class="player" aria-label="Анимация маршрута">
      <svg id="stage" class="stage" aria-hidden="true"></svg>
      <div class="beat" aria-live="polite">
        <p class="phase" id="phase"></p><h2 id="beat-title"></h2><p id="beat-text"></p><p class="condition" id="condition"></p><div id="route-context"></div>
      </div>
      <div class="controls">
        <button type="button" id="play">Смотреть</button>
        <button type="button" id="prev">← Назад</button>
        <button type="button" id="next">Дальше →</button>
        <button type="button" id="restart">С начала</button>
        <span id="position"></span>
        <progress id="progress" aria-label="Ход анимации"></progress>
      </div>
    </section>
    <nav class="timeline" aria-labelledby="timeline-title">
      <h2 id="timeline-title">Этапы маршрута</h2>
      <ol id="steps"></ol>
    </nav>
  </div>
  <details class="source" id="source">
    <summary id="source-title"></summary>
    <blockquote id="source-text"></blockquote>
    <a href="../../corpus/text/mipt-matpomosch-obuch.txt">Полный текст регламента из базы</a>
  </details>
</main>
<script src="aid-route-data.js"></script>
<script>
const { scenes, clauses } = materialAidRoute;
const el = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const timeline = el('steps');
const play = el('play');
const progress = el('progress');
const stage = el('stage');
const sceneLibrary = new URL('.', location.href).href;
let player;
let animationDuration;
const sceneDuration = 8200;
progress.max = scenes.length * sceneDuration;
let index = 0;
let elapsed = 0;
let frame = 0;
let previous = null;
let running = false;

const controls = scenes.map((scene, number) => {
  const li = document.createElement('li');
  const button = document.createElement('button');
  const count = document.createElement('span');
  const label = document.createElement('span');
  button.type = 'button';
  count.textContent = String(number + 1).padStart(2, '0');
  label.textContent = scene.title;
  const phase = document.createElement('small');
  phase.textContent = scene.phase;
  label.append(phase);
  button.append(count, label);
  li.append(button);
  timeline.append(li);
  button.addEventListener('click', () => seek(number));
  return button;
});

function renderScene() {
  const scene = scenes[index];
  const { renderer, config } = window.RouteSceneEditor.build(scene.sceneChoice, sceneLibrary);
  player = renderer.create(stage, id => sceneLibrary + window.ComicPeople.portraitUrl(id));
  player.load(config);
  animationDuration = renderer.duration;
  el('phase').textContent = scene.phase + ' · ' + scene.cites.join(', ');
  const docs = ['mipt-matpomosch-obuch'];
  window.RouteGuide.annotate(el('beat-title'), scene.title, docs);
  window.RouteGuide.annotate(el('beat-text'), scene.text, docs);
  window.RouteGuide.annotate(el('condition'), scene.condition || '', docs);
  el('route-context').replaceChildren(window.RouteGuide.transition(scene.transition, docs));
  el('source-title').textContent = 'Сверить с регламентом · ' + scene.cites.join(', ');
  el('source-text').textContent = scene.cites.map(id => clauses[id]).join('\n\n');
  el('source').open = false;
  el('position').textContent = (index + 1) + ' / ' + scenes.length;
  el('prev').disabled = index === 0;
  el('next').disabled = index === scenes.length - 1;
  controls.forEach((button, number) => {
    if (number === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  renderMotion();
}

function renderMotion() {
  player.render(reducedMotion.matches ? animationDuration : Math.min(animationDuration, elapsed));
  progress.value = index * sceneDuration + elapsed;
}

function stop() {
  running = false;
  cancelAnimationFrame(frame);
  previous = null;
  play.textContent = elapsed >= sceneDuration ? 'Повторить' : elapsed ? 'Продолжить' : 'Смотреть';
}

function seek(number) {
  elapsed = 0;
  stop();
  index = number;
  renderScene();
}

function tick(now) {
  if (previous !== null) elapsed += now - previous;
  previous = now;
  if (elapsed >= sceneDuration) {
    if (index === scenes.length - 1) {
      elapsed = sceneDuration;
      renderMotion();
      stop();
      return;
    }
    elapsed = 0;
    index++;
    renderScene();
  }
  renderMotion();
  frame = requestAnimationFrame(tick);
}

function start() {
  if (elapsed >= sceneDuration) seek(0);
  running = true;
  play.textContent = 'Пауза';
  frame = requestAnimationFrame(tick);
}

reducedMotion.addEventListener('change', renderMotion);
play.addEventListener('click', () => { if (running) stop(); else start(); });
el('prev').addEventListener('click', () => seek(index - 1));
el('next').addEventListener('click', () => seek(index + 1));
el('restart').addEventListener('click', () => { seek(0); start(); });
const requestedStep = Number(new URLSearchParams(location.search).get('step'));
seek(Number.isInteger(requestedStep) && requestedStep >= 1 && requestedStep <= scenes.length ? requestedStep - 1 : 0);
</script>
</body>
</html>
