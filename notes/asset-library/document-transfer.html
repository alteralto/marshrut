<!doctype html>
<html lang="ru" data-style="apple" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Передать документ · Маршрут</title>
<link rel="stylesheet" href="../mockup/graphite.css">
<link rel="stylesheet" href="route-guide.css">
<script src="../mockup/graphite.js"></script>
<script src="glossary-terms.js" defer></script>
<script src="route-guide.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.5 var(--font); }
  a { color: var(--stamp); text-decoration: none; text-underline-offset: 4px; }
  a:hover { text-decoration: underline; }
  button, input { font: inherit; }
  button, summary { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--stamp); outline-offset: 4px; }
  main { width: min(1040px, calc(100% - 48px), max(750px, calc(191svh - 560px))); margin: auto; padding: 18px 0 50px; }
  .masthead, header, .examples, .caption, .controls { display: flex; align-items: center; gap: 12px; }
  .masthead { justify-content: space-between; min-height: 44px; border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: -.025em; }
  .brand-icon { display: grid; place-items: center; border-radius: 8px; width: 27px; height: 27px; background: var(--ink); color: var(--sheet); }
  .masthead a, header a { font-size: 13px; }
  header { justify-content: space-between; align-items: end; margin: 22px 0 14px; }
  h1 { margin: 0 0 4px; font-size: clamp(34px, 5.4vw, 57px); line-height: 1.04; font-weight: 650; letter-spacing: -.055em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  header a { flex: 0 0 auto; }
  .examples { width: fit-content; max-width: 100%; gap: 3px; flex-wrap: wrap; margin: 0 0 12px; padding: 3px; background: #e9eaf0; border-radius: 999px; }
  .examples button { padding: 6px 14px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 600; }
  .examples button[aria-pressed="true"] { color: var(--ink); background: var(--segment); box-shadow: 0 1px 4px #1d1d1f1a; }
  .examples button:hover:not([aria-pressed="true"]) { color: var(--ink); }
  .player { overflow: hidden; border: 1px solid var(--rule); border-radius: var(--radius-card); background: var(--sheet); box-shadow: var(--card-shadow); }
  .screen { display: block; width: 100%; height: auto; background: var(--lane); }
  .controls { padding: 10px 18px; gap: 11px; }
  .controls button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 37px; padding: 6px 11px; border: 0; border-radius: 999px; color: var(--ink); background: var(--lane); }
  .controls button:hover { background: var(--hover); }
  #play { min-width: 116px; background: var(--action); color: var(--on-stamp); font-size: 14px; font-weight: 600; }
  #play:hover { background: var(--action-hover); }
  .controls svg { width: 15px; height: 15px; }
  #seek { width: 100%; min-width: 24px; accent-color: var(--action); cursor: pointer; }
  #timecode { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .caption { padding: 13px 18px 16px; border-top: 1px solid var(--rule); min-height: 76px; align-items: baseline; }
  #number { flex: 0 0 auto; color: var(--muted); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .caption h2 { margin: 0 0 5px; font-size: 18px; line-height: 1.25; font-weight: 650; letter-spacing: -.022em; }
  .caption p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .chapters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0; margin: 12px 0 21px; list-style: none; }
  .chapters button { width: 100%; height: 100%; text-align: left; padding: 10px 12px; background: var(--sheet); color: var(--muted); border: 1px solid var(--rule); border-radius: 12px; font-size: 13px; }
  .chapters button:hover { background: var(--lane); }
  .chapters button[aria-current="step"] { background: var(--stamp-soft); color: var(--selected); border-color: var(--selected-line); font-weight: 600; }
  details { border-top: 1px solid var(--rule); padding: 15px 0; color: var(--muted); font-size: 14px; }
  summary { color: var(--ink); font-weight: 600; }
  blockquote { margin: 14px 0; padding-left: 12px; border-left: 2px solid var(--selected-line); max-width: 78ch; line-height: 1.55; white-space: pre-line; }
  #source-note { margin: 12px 0; max-width: 79ch; line-height: 1.5; }
  @media (max-width: 690px) {
    main { width: calc(100% - 26px); padding-top: 10px; }
    header { align-items: start; flex-direction: column; gap: 7px; margin-top: 18px; }
    .player { border-radius: 17px; }
    .caption { min-height: 100px; padding: 11px; gap: 8px; }
    .caption h2 { font-size: 16px; }
    .controls { padding-inline: 10px; gap: 7px; }
    #play { min-width: 0; font-size: 13px; }
    #timecode { font-size: 10px; }
    .chapters button { padding: 8px 6px; }
  }
  .example-route { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .example-route a { margin-inline-start: 8px; }
</style>
<script src="comic-people.js" defer></script>
<script src="scene-examples.js" defer></script>
<script src="transfer-scene.js" defer></script>
</head>
<body>
<main>
  <div class="masthead">
    <a href="mipt-scene-library.html">← Библиотека сцен</a>
    <span class="brand"><span class="brand-icon" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16h4l3-10h4l3 10h2"/><circle cx="3" cy="16" r="1.2" fill="currentColor"/><circle cx="18" cy="16" r="1.2" fill="currentColor"/></svg></span>Маршрут</span>
    <a href="aid-comic.html">«Путь выписки» ↗</a>
  </div>
  <header>
    <div><h1>Передать документ</h1><p>Примеры из регламентов МФТИ</p></div>
    <a id="source-jump" href="#source">Сверить с регламентом ↓</a>
  </header>
  <div class="examples" role="group" aria-label="Примеры из регламентов">
    <button type="button" data-example="aid" aria-pressed="true">Матпомощь</button>
    <button type="button" data-example="trip" aria-pressed="false">Командировка</button>
    <button type="button" data-example="fls" aria-pressed="false">ФЛС для НИОКР</button>
    <button type="button" data-example="concert" aria-pressed="false">Концертный зал</button>
  </div>
  <p class="example-route"><span id="route-stage"></span> <a id="route-link" hidden></a></p>

  <section class="player" aria-label="Анимация передачи документа">
    <svg id="stage" class="screen" width="960" height="460" aria-hidden="true"></svg>
    <div class="controls">
      <button id="play" type="button"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M5 3l8 5-8 5z"/></svg><span id="play-label">Смотреть</span></button>
      <button id="restart" type="button" aria-label="Вернуться к началу" title="К началу"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 6a5 5 0 1 1-.1 4M3 2v4h4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <input id="seek" type="range" min="0" step="1" value="0" aria-label="Позиция в анимации">
      <span id="timecode"></span>
    </div>
    <div class="caption" aria-live="polite">
      <span id="number"></span>
      <div><h2 id="caption-title"></h2><p id="caption-text"></p></div>
    </div>
  </section>

  <ol class="chapters" aria-label="Кадры анимации">
    <li><button type="button" data-chapter="0">01 · Участники</button></li>
    <li><button type="button" data-chapter="1">02 · Документ</button></li>
    <li><button type="button" data-chapter="2" id="delivery">03 · Передача</button></li>
  </ol>
  <details id="source">
    <summary id="source-title"></summary>
    <blockquote id="source-quote"></blockquote>
    <p id="source-note"></p>
    <a id="source-link" target="_blank" rel="noopener">Открыть текст регламента</a>
  </details>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const examples = window.SceneExamples.transfer;

  const byId = id => document.getElementById(id);
  const stage = byId('stage');
  const player = window.DocumentTransferScene.create(stage, window.ComicPeople.portraitUrl);
  const duration = window.DocumentTransferScene.duration;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const exampleButtons = [...document.querySelectorAll('[data-example]')];
  const chapterButtons = [...document.querySelectorAll('[data-chapter]')];
  const chapterStarts = [0, 1900, 3900];
  const chapterPreviews = [0, 3000, duration];
  const seek = byId('seek');
  const captionTitle = byId('caption-title');
  const captionText = byId('caption-text');
  let example = null;
  let time = 0;
  let frame = null;
  let activeChapter = -1;

  function timeLabel(value) {
    return '0:' + String(Math.floor(value / 1000)).padStart(2, '0');
  }

  function syncPlay() {
    const playing = frame !== null;
    byId('play-label').textContent = playing ? 'Пауза' : time === duration ? 'Повторить' : 'Смотреть';
    byId('play-icon').setAttribute('d', playing ? 'M4 3h3v10H4z M9 3h3v10H9z' : 'M5 3l8 5-8 5z');
  }

  function show(value) {
    time = value;
    const chapter = chapterStarts.findLastIndex(start => value >= start);
    player.render(motion.matches ? chapterPreviews[chapter] : value);
    seek.value = value;
    seek.setAttribute('aria-valuetext', timeLabel(value));
    byId('timecode').textContent = timeLabel(value) + ' / ' + timeLabel(duration);
    if (chapter !== activeChapter) {
      activeChapter = chapter;
      const [title, text] = example.chapters[chapter];
      byId('number').textContent = '0' + (chapter + 1) + ' / 03';
      window.RouteGuide.annotate(captionTitle, title, [example.route.doc]);
      window.RouteGuide.annotate(captionText, text, [example.route.doc]);
      chapterButtons.forEach((button, index) => {
        if (index === chapter) button.setAttribute('aria-current', 'step');
        else button.removeAttribute('aria-current');
      });
    }
  }

  function pause() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    syncPlay();
  }

  function start() {
    if (time === duration) show(0);
    const origin = performance.now() - time;
    function tick(now) {
      show(Math.min(duration, Math.max(0, now - origin)));
      if (time < duration) frame = requestAnimationFrame(tick);
      else pause();
    }
    frame = requestAnimationFrame(tick);
    syncPlay();
  }

  function selectExample(key) {
    pause();
    example = examples[key];
    activeChapter = -1;
    player.load(example);
    for (const button of exampleButtons) {
      button.setAttribute('aria-pressed', String(button.dataset.example === key));
    }
    byId('delivery').textContent = example.delivery;
    byId('source-title').textContent = example.source.title;
    byId('source-quote').textContent = example.source.quote;
    byId('source-note').textContent = example.source.note;
    byId('source-link').href = example.source.url;
    window.RouteGuide.annotate(byId('route-stage'), 'Этап · ' + example.route.label, [example.route.doc]);
    const routeLink = byId('route-link');
    routeLink.hidden = location.protocol === 'file:';
    routeLink.href = example.route.href;
    routeLink.textContent = key === 'purchase' ? 'Пункт регламента ↗' : 'Открыть в полном маршруте ↗';
    show(0);
    syncPlay();
  }

  seek.max = duration;
  seek.addEventListener('input', () => { pause(); show(Number(seek.value)); syncPlay(); });
  byId('play').addEventListener('click', () => { if (frame === null) start(); else pause(); });
  byId('restart').addEventListener('click', () => { pause(); show(0); syncPlay(); });
  for (const button of exampleButtons) {
    button.hidden = !Object.hasOwn(examples, button.dataset.example);
    button.addEventListener('click', () => selectExample(button.dataset.example));
  }
  for (const button of chapterButtons) {
    button.addEventListener('click', () => { pause(); show(chapterPreviews[Number(button.dataset.chapter)]); syncPlay(); });
  }
  byId('source-jump').addEventListener('click', () => { byId('source').open = true; });
  motion.addEventListener('change', () => show(time));
  const requestedExample = new URLSearchParams(location.search).get('example');
  const defaultExample = Object.hasOwn(examples, 'aid') ? 'aid' : Object.keys(examples)[0];
  if (defaultExample) selectExample(Object.hasOwn(examples, requestedExample) ? requestedExample : defaultExample);
  else location.replace('scene-workshop.html');
});
</script>
</body>
</html>
