<!doctype html>
<html lang="ru" data-style="apple" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сцены и предметы · Маршрут</title>
<link rel="stylesheet" href="/graphite.css">
<script src="/graphite.js"></script>
<script defer src="comic-people.js"></script>
<script defer src="scene-kit.js"></script>
<script defer src="prepare-scene.js"></script>
<script defer src="transfer-scene.js"></script>
<script defer src="check-scene.js"></script>
<script defer src="commission-scene.js"></script>
<script defer src="route-action-scene.js"></script>
<script defer src="scene-editor.js"></script>
<script defer src="scene-workshop.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); }
main { width: min(100% - 32px, 960px); margin: auto; padding: 22px 0 48px; }
nav { display: flex; gap: 16px; flex-wrap: wrap; }
a { color: var(--stamp); text-underline-offset: 4px; }
h1 { margin: 28px 0 18px; font-size: clamp(35px, 5vw, 58px); line-height: 1.05; letter-spacing: -.05em; }
h2 { margin: 25px 0 10px; }
p { margin: 0; color: var(--muted); }
.player { overflow: hidden; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-card); box-shadow: var(--card-shadow); }
#stage { display: block; width: 100%; aspect-ratio: 960 / 460; height: auto; background: var(--lane); }
.player footer { padding: 12px 16px; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; }
button, select { font: inherit; border-radius: 9px; padding: 6px 10px; color: var(--ink); border: 1px solid var(--rule); background: var(--sheet); }
button { cursor: pointer; }
.options { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0; }
.options label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.assets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 10px; }
.assets li { padding: 13px; border-radius: 13px; border: 1px solid var(--rule); background: var(--sheet); }
.assets img { display: block; width: 48px; height: 48px; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <nav aria-label="Разделы"><a href="/">← Навигатор</a><a href="mipt-scene-library.html">Примеры по регламентам</a><a href="comic-cast.html">Персонажи</a><a href="#objects">Предметы</a></nav>
  <h1>Сцены и предметы</h1>
  <section aria-labelledby="interview">
    <h2 id="interview">Провести интервью</h2>
    <div class="options">
      <label>Предмет в кадре <select id="preview-object"></select></label>
      <label>Персонаж кандидата <select id="preview-candidate"></select></label>
    </div>
    <div class="player">
      <svg id="stage" viewBox="0 0 960 460" aria-hidden="true"></svg>
      <footer><button id="replay" type="button">Повторить сцену</button><p>Вопрос, ответ и запись итогов интервью.</p></footer>
    </div>
  </section>
  <section aria-labelledby="objects"><h2 id="objects">Предметы</h2><ul class="assets" id="assets"></ul></section>
</main>
</body>
</html>
